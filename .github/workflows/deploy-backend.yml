name: Deploy Backend (Cloud Run)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: portfolio-api
  REPO: containers

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Submit asynchronously and poll status via the Cloud Build API.
          # Avoids gcloud exiting 1 when it cannot stream the default logs bucket.
          BUILD_ID=$(gcloud builds submit backend --tag "$IMAGE" --async --format='value(id)')
          echo "Cloud Build ID: ${BUILD_ID}"
          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --format='value(status)')
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build failed with status ${STATUS}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for build ${BUILD_ID}"
          exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --region "${REGION}" \
            --image "${IMAGE}" \
            --service-account "portfolio-api-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 10

      - name: Smoke test /health
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/health"; then echo " OK"; exit 0; fi
            echo "retry $i..."; sleep 5
          done
          echo "health check failed"; exit 1
